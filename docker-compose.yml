services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bhashascribe
      POSTGRES_PASSWORD: bhashascribe
      POSTGRES_DB: bhashascribe
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://bhashascribe:bhashascribe@db:5432/bhashascribe
      WHISPER_MODEL_SIZE: small
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_WS_URL: ws://localhost:8000/ws/transcribe
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
