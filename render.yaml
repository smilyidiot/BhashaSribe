databases:
  - name: bhashascribe-db
    plan: free

services:
  - type: web
    name: bhashascribe-backend
    runtime: docker
    rootDir: backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bhashascribe-db
          property: connectionString
      - key: WHISPER_MODEL_SIZE
        value: tiny
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: CORS_ORIGINS
        value: https://bhashascribe-frontend.onrender.com

  - type: web
    name: bhashascribe-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://bhashascribe-backend.onrender.com
      - key: VITE_WS_URL
        value: wss://bhashascribe-backend.onrender.com/ws/transcribe
